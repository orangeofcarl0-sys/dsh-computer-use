# dsh-computer-use bundle patch：把 Computer Use 插件插入 profile。
#
# 作为 dsh.bundle.patch 被 dsh 加载器消费。insert 引用本包（dsh-computer-use），
# 加载器会从 profile 的 node_modules 解析它并加载为 Cordis 插件。
- insert:
    - id: dsh-computer-use
      name: dsh-computer-use
      config:
        # 观察快照有效期（毫秒）：长会话减少重复观察
        ttlMs: 60000
        maxElements: 500
        # 极危清单（注记警告，不阻断）：正则源数组，命中元素标签时在结果附警告注记。
        # 默认空 = 零差异；按需增补，如：
        #   extremePatterns: ['永久删除|格式化|清空回收站']
        # 凭据硬保护（密码框拒绝自动输入）独立于本清单，始终生效。
        # extremePatterns: []
        # 前后台投递：
        #   auto 默认：后台优先；background_unavailable 时自动前台重试（驱动恢复原焦点）
        #   background 全程后台（不抢焦点）；后台不可用→结构化错误+升级指引
        #   foreground 始终前台（短暂焦点交换）
        deliveryMode: auto
